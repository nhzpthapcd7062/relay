<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>远程画面</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body.control-mode video {
      cursor: none;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      outline: none;
    }
    .info-panel {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 8px 10px;
      min-width: 170px;
      font: 12px/1.4 "Avenir Next", "PingFang SC", sans-serif;
      backdrop-filter: blur(4px);
    }
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .quality-select {
      background: rgba(18, 18, 18, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <video id="streamVideo" autoplay playsinline muted tabindex="0"></video>
  <div class="info-panel" id="infoPanel">
    <div class="info-row"><span>FPS</span><span id="fpsValue">0 fps</span></div>
    <div class="info-row"><span>网速</span><span id="netValue">0 kbps</span></div>
    <div class="info-row">
      <span>清晰度</span>
      <select id="qualitySelect" class="quality-select">
        <option value="low">流畅</option>
        <option value="medium">高清</option>
        <option value="high">超清</option>
      </select>
    </div>
  </div>
</body>
</html>
